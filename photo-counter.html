<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Counter</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6a737d;--accent:#2f6fed;--accent-t:#fff;--line:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2227;--text:#eceff3;--muted:#98a2ad;--accent:#5b8cff;--accent-t:#0b1020;--line:#2d333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2227;--text:#eceff3;--muted:#98a2ad;--accent:#5b8cff;--accent-t:#0b1020;--line:#2d333b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent)}
.drop input{display:none}
#preview{display:none;width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-bottom:12px;background:var(--bg)}
label.l{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
button{font:inherit;cursor:pointer}
#go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-weight:600;font-size:1rem}
#go:disabled{opacity:.5;cursor:default}
#msg{margin:10px 0 0;color:var(--muted);font-size:.9rem;min-height:1.2em}
.total{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.total b{font-size:2rem}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.name{flex:1;word-break:break-word;text-transform:capitalize}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1.1rem;line-height:1}
.ctl span{min-width:28px;text-align:center;font-weight:600}
.note{color:var(--muted);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Photo Counter</h1>
  <p class="sub">Upload a photo and Claude counts what is in it.</p>

  <div class="card">
    <img id="preview" alt="Selected photo">
    <label class="drop" id="drop">
      <span id="droptext">Tap to upload or take a photo</span>
      <input id="file" type="file" accept="image/*">
    </label>
    <label class="l" for="what">What to count? (leave empty to count everything)</label>
    <input id="what" type="text" placeholder="e.g. people, cars, apples">
    <button id="go" disabled>Count</button>
    <p id="msg"></p>
  </div>

  <div class="card" id="out" style="display:none">
    <div class="total"><span>Total</span><b id="total">0</b></div>
    <div id="rows"></div>
    <p class="note" id="note"></p>
  </div>
</main>
<script>
(function(){
  var fileEl=document.getElementById('file'),prev=document.getElementById('preview'),
      go=document.getElementById('go'),msg=document.getElementById('msg'),
      out=document.getElementById('out'),rows=document.getElementById('rows'),
      totalEl=document.getElementById('total'),noteEl=document.getElementById('note'),
      what=document.getElementById('what'),dropText=document.getElementById('droptext');
  var blob=null,items=[];

  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var max=1280,s=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){b?res({blob:b,url:URL.createObjectURL(b)}):rej(new Error('encode'))},'image/jpeg',0.85);
        URL.revokeObjectURL(url);
      };
      img.onerror=function(){rej(new Error('load'))};
      img.src=url;
    });
  }

  fileEl.addEventListener('change',async function(){
    var f=fileEl.files&&fileEl.files[0];
    if(!f)return;
    msg.textContent='Preparing photo...';
    try{
      var r=await shrink(f);
      blob=r.blob;prev.src=r.url;prev.style.display='block';
      dropText.textContent='Tap to change photo';
      go.disabled=false;msg.textContent='';out.style.display='none';
    }catch(e){msg.textContent='Could not read this image. Try another one.'}
  });

  function render(){
    rows.innerHTML='';
    var sum=0;
    items.forEach(function(it,i){
      sum+=it.count;
      var row=document.createElement('div');row.className='row';
      var n=document.createElement('div');n.className='name';n.textContent=it.name;
      var ctl=document.createElement('div');ctl.className='ctl';
      var m=document.createElement('button');m.textContent='\u2212';m.setAttribute('aria-label','Decrease');
      var v=document.createElement('span');v.textContent=it.count;
      var p=document.createElement('button');p.textContent='+';p.setAttribute('aria-label','Increase');
      m.onclick=function(){if(it.count>0){it.count--;render()}};
      p.onclick=function(){it.count++;render()};
      ctl.append(m,v,p);row.append(n,ctl);rows.append(row);
    });
    totalEl.textContent=sum;
  }

  go.addEventListener('click',async function(){
    if(!blob)return;
    go.disabled=true;msg.textContent='Counting...';
    try{
      var sample=await claude.use('sample');
      if(!sample){msg.textContent='Counting is not available here. Open this page inside Claude.';go.disabled=false;return}
      var target=what.value.trim();
      var prompt='Count the objects in the attached photo. '+
        (target?'Count only: '+target+'. ':'List each distinct kind of object you can clearly see and count each kind. ')+
        'Count carefully, one by one. Respond with ONLY JSON, no other text, in this form: '+
        '{"items":[{"name":"short plural name","count":0}],"note":"one short sentence about uncertainty or hidden items"}';
      var res=await sample(prompt,{images:[blob],modelTier:'default',cache:false});
      var t=(res.text||'').replace(/```json|```/g,'').trim();
      var a=t.indexOf('{'),b=t.lastIndexOf('}');
      var data=JSON.parse(t.slice(a,b+1));
      items=(data.items||[]).map(function(x){return{name:String(x.name||'item'),count:Math.max(0,parseInt(x.count,10)||0)}});
      noteEl.textContent=data.note||'';
      out.style.display='block';render();
      msg.textContent=items.length?'':'Nothing found. Try a clearer photo.';
    }catch(e){
      msg.textContent=(e&&e.code==='rate_limited')?'Too many tries. Wait a moment and try again.':
        (e&&e.code==='not_granted')?'Permission was not given.':'Something went wrong. Please try again.';
    }
    go.disabled=false;
  });
})();
</script>
</body>
</html>
